name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --release
      - name: test
        run: cargo test --release
      - name: upload dll
        uses: actions/upload-artifact@v4
        with:
          name: qiangyin-windows-x64
          path: target/release/qiangyin.dll

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --release
      - name: test
        run: cargo test --release
      - name: upload so
        uses: actions/upload-artifact@v4
        with:
          name: qiangyin-linux-x64
          path: target/release/libqiangyin.so

  tsf:
    # 强音输入法 TSF 外壳（C++）：MSVC 编译出 qiangyin_ime.dll
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: configure
        run: cmake -S tsf -B build-tsf -A x64
      - name: build
        run: cmake --build build-tsf --config Release
      - name: upload ime dll
        uses: actions/upload-artifact@v4
        with:
          name: qiangyin-ime-windows-x64
          path: build-tsf/Release/qiangyin_ime.dll
