name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --release
      - name: test
        run: cargo test --release
      - name: upload dll
        uses: actions/upload-artifact@v4
        with:
          name: qiangyin-windows-x64
          path: target/release/qiangyin.dll

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --release
      - name: test
        run: cargo test --release
      - name: upload so
        uses: actions/upload-artifact@v4
        with:
          name: qiangyin-linux-x64
          path: target/release/libqiangyin.so

  tsf:
    # 强音输入法 TSF 外壳（C++）：MSVC 编译出 qiangyin_ime.dll
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: configure
        run: cmake -S tsf -B build-tsf -A x64
      - name: build
        shell: pwsh
        run: |
          cmake --build build-tsf --config Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $n = 0
            foreach ($line in (Get-Content build.log)) {
              if ($line -match 'error' -and $n -lt 25) {
                $n++
                if ($line -match '^(.*)\((\d+)(,\d+)?\): error (\w+): (.*)$') {
                  Write-Host ("::error file=" + $Matches[1] + ",line=" + $Matches[2] + "::" + $Matches[4] + ": " + $Matches[5])
                } else {
                  Write-Host ("::error::" + $line)
                }
              }
            }
            exit 1
          }
      - name: upload ime dll
        uses: actions/upload-artifact@v4
        with:
          name: qiangyin-ime-windows-x64
          path: build-tsf/Release/qiangyin_ime.dll

  installer:
    # 打包 NSIS 安装包 QiangYin-Setup.exe（含引擎 DLL + TSF DLL + 码表）
    runs-on: windows-latest
    needs: [windows, tsf]
    steps:
      - uses: actions/checkout@v4
      - name: download engine dll
        uses: actions/download-artifact@v4
        with:
          name: qiangyin-windows-x64
          path: build-installer/staging
      - name: download ime dll
        uses: actions/download-artifact@v4
        with:
          name: qiangyin-ime-windows-x64
          path: build-installer/staging
      - name: stage data files
        shell: pwsh
        run: |
          Copy-Item data/mb.txt build-installer/staging/
          Copy-Item data/usercode.txt build-installer/staging/
          Get-ChildItem build-installer/staging
      - name: build installer
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) {
            Write-Host "Installing NSIS via Chocolatey..."
            choco install nsis -y --no-progress
            $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          if (!(Test-Path $nsis)) { $nsis = "$env:ProgramFiles\NSIS\makensis.exe" }
          Write-Host "NSIS: $nsis"
          if (!(Test-Path $nsis)) { Write-Host "::error::makensis not found"; exit 1 }
          # 安装包文件名带版本：tag 构建用 tag 名（vX.Y.Z），master 构建用 dev-<短SHA>
          $ref = "${{ github.ref_name }}"
          if ($ref -like "v*") { $ver = $ref } else { $ver = "dev-" + "${{ github.sha }}".Substring(0, 7) }
          Write-Host "version: $ver"
          & $nsis "/DVERSION=$ver" installer/qiangyin.nsi 2>&1 | Tee-Object -FilePath nsis.log
          if ($LASTEXITCODE -ne 0) {
            foreach ($line in (Get-Content nsis.log)) {
              if ($line -match '[Ee]rror') { Write-Host ("::error::" + $line) }
            }
            exit 1
          }
          Get-ChildItem "QiangYin-Setup-*.exe"
      - name: upload installer
        uses: actions/upload-artifact@v4
        with:
          name: qiangyin-setup-windows-x64
          path: QiangYin-Setup-*.exe

  release:
    # 打 v* tag 时：安装包发布为 GitHub Release（永久下载地址，无需登录）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installer]
    runs-on: windows-latest
    permissions:
      contents: write # 默认 GITHUB_TOKEN 只读，发 Release 需要写权限
    steps:
      - uses: actions/checkout@v4
      - name: download installer
        uses: actions/download-artifact@v4
        with:
          name: qiangyin-setup-windows-x64
      - name: create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = (Get-ChildItem "QiangYin-Setup-*.exe" | Select-Object -First 1).Name
          Write-Host "asset: $exe"
          gh release create $tag --title "强音输入法 $tag" --generate-notes $exe
