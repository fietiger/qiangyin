name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --release
      - name: test
        run: cargo test --release
      - name: upload dll
        uses: actions/upload-artifact@v4
        with:
          name: qiangyin-windows-x64
          path: target/release/qiangyin.dll

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --release
      - name: test
        run: cargo test --release
      - name: upload so
        uses: actions/upload-artifact@v4
        with:
          name: qiangyin-linux-x64
          path: target/release/libqiangyin.so
